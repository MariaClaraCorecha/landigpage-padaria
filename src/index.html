<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Padaria | Pães, doces e cafés artesanais</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Cardápio online de uma padaria artesanal: pães, bolos, docinhos, salgados, cafés e bebidas, com cestinha de pedidos."
    />
    <meta name="theme-color" content="#4b2e22" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Padaria | Pães, doces e cafés artesanais" />
    <meta
      property="og:description"
      content="Cardápio online com pães, bolos, docinhos, salgados, cafés e bebidas."
    />
    <meta property="og:image" content="images/hero.webp" />
    <link rel="icon" type="image/x-icon" href="bolo.ico" />
    <link rel="preload" as="image" href="images/hero.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&icon_names=add,bakery_dining,brunch_dining,cake,coffee,cookie,dark_mode,delete_outline,eco,grain,icecream,light_mode,liquor,local_drink,lunch_dining,pie_chart,remove,restaurant_menu,shopping_basket,task_alt&display=block"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/system theme before Angular boots so the page doesn't flash light.
      try {
        var saved = localStorage.getItem('padaria:theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
